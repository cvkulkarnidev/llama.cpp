name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch llama.cpp
        run: bash scripts/fetch_llama_cpp.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-tools libvulkan-dev
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install SPIRV-Headers CMake package
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers .deps/SPIRV-Headers
          cmake -S .deps/SPIRV-Headers -B .deps/SPIRV-Headers/build \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.deps/spirv-headers-install"
          cmake --install .deps/SPIRV-Headers/build
          SPIRV_HEADERS_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/.deps/spirv-headers-install" -name 'SPIRV-HeadersConfig.cmake' -print -quit)")"
          test -n "$SPIRV_HEADERS_DIR"
          echo "SPIRV_HEADERS_DIR=$SPIRV_HEADERS_DIR" >> "$GITHUB_ENV"
          echo "SPIRV_HEADERS_INCLUDE_DIR=$GITHUB_WORKSPACE/.deps/spirv-headers-install/include" >> "$GITHUB_ENV"

      - name: Fetch Vulkan headers
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers .deps/Vulkan-Headers
          echo "VULKAN_HEADERS_INCLUDE_DIR=$GITHUB_WORKSPACE/.deps/Vulkan-Headers/include" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: bash ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-gemma-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
